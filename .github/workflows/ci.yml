name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Generate example report
        run: >-
          python skills/mobile-security-review/scripts/review_android.py
          --manifest tests/fixtures/AndroidManifest.xml
          --network-config tests/fixtures/network_security_config.xml
          --build-context release --output /tmp/mobile-security-review.md
      - run: git diff --check
